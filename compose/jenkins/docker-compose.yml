services:

  jenkins:
    image: devsecops-jenkins:lts
    container_name: jenkins

    restart: unless-stopped

    user: root

    privileged: true

    ports:
      - "8080:8080"
      - "50000:50000"

    environment:
      TZ: Africa/Casablanca

    volumes:
      - /home/saphae/devsecops/data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - devsecops-network

networks:

  devsecops-network:
    external: true
