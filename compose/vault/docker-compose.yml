services:

  vault:

    image: hashicorp/vault:1.20

    container_name: vault

    restart: unless-stopped

    cap_add:
      - IPC_LOCK

    ports:
      - "8200:8200"

    volumes:
      - /home/saphae/devsecops/data/vault:/vault/file
      - ./config:/vault/config

    command: vault server -config=/vault/config/vault.hcl

    networks:
      - devsecops-network

networks:

  devsecops-network:
    external: true
